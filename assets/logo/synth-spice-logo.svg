<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 44" width="220" height="44" role="img" aria-label="Logo Synth and Spice">
  <defs>
    <linearGradient id="ssHexStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="55%" stop-color="#1677FF"/>
      <stop offset="100%" stop-color="#FF2BD6"/>
    </linearGradient>
    <linearGradient id="ssSpiceCore" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3158"/>
      <stop offset="100%" stop-color="#FF2BD6"/>
    </linearGradient>
  </defs>
  <!-- Angular hexagonal tech frame -->
  <polygon points="22,3 38,12 38,32 22,41 6,32 6,12" fill="#0B1220" stroke="url(#ssHexStroke)" stroke-width="2.2"/>
  <polygon points="22,7 34,14 34,30 22,37 10,30 10,14" fill="none" stroke="#00E5FF" stroke-opacity="0.35" stroke-width="1"/>
  <!-- Stylized flame + circuit fork bolt inside hexagon -->
  <path d="M22 10 L27 19 L23 19 L26 28 L22 34 L17 24 L21 24 L18 16 Z" fill="url(#ssSpiceCore)"/>
  <circle cx="15" cy="18" r="1.6" fill="#00E5FF"/>
  <circle cx="29" cy="26" r="1.6" fill="#00E5FF"/>
  <path d="M15 18 H18 M26 26 H29" stroke="#00E5FF" stroke-width="1.3" stroke-linecap="square"/>
  <!-- Wordmark -->
  <text x="48" y="21" font-family="'Chakra Petch', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.6" fill="#F4F7FF">SYNTH <tspan fill="#00E5FF">&amp;</tspan> SPICE</text>
  <text x="48" y="34" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="8.5" font-weight="600" letter-spacing="2.2" fill="#9BA8BC">CYBER FAST FOOD</text>
</svg>
